# Serves the SPA and proxies the API + WebSocket to the backend container.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream pushtalk_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Slightly above MAX_UPLOAD_BYTES (5 MB) to leave room for multipart framing;
    # the backend enforces the exact limit and returns a proper JSON error.
    client_max_body_size 6m;
    # Keep the API's JSON error shape even when nginx itself rejects the body.
    error_page 413 = @payload_too_large;
    location @payload_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"FILE_TOO_LARGE","message":"Recording is too large"}}';
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /api/ws/ {
        proxy_pass http://pushtalk_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Longer than the client heartbeat (15 s) so idle-but-alive sockets stay open.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /api/ {
        proxy_pass http://pushtalk_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routing: unknown paths return index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
